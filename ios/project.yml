# XcodeGen specification for the Glance iPhone companion.
# Generate: `cd ios && xcodegen generate` (brew install xcodegen). Open Glance.xcodeproj afterwards.
name: Glance
options:
  bundleIdPrefix: com.glance
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true
  xcodeVersion: "27.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""            # set your team in Xcode → Signing & Capabilities
    GLANCE_API_BASE: "https://glance-blue.vercel.app"
    META_APP_ID: ""                  # Meta developer app id for the Wearables Device Access Toolkit
    META_CLIENT_TOKEN: ""
  configs:
    Debug:
      GLANCE_API_BASE: "https://glance-blue.vercel.app"
packages:
  MWDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: "1.0.1"
targets:
  Glance:
    type: application
    platform: iOS
    sources:
      - path: Glance/Sources
      - path: ../src/lens/lens.css
        group: Glance/Resources
        buildPhase: resources
      - path: Glance/Resources/native-lens.js
        buildPhase: resources
    resources: [Glance/Resources]
    info:
      path: Glance/Resources/Info.plist
      properties:
        CFBundleDisplayName: Glance
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Light
        CFBundleURLTypes:
          - CFBundleURLSchemes: [glance]
        NSCameraUsageDescription: Glance uses the camera on your glasses or phone to recognize products you choose to scan.
        NSBluetoothAlwaysUsageDescription: Glance connects to your Meta glasses over Bluetooth.
        NSLocalNetworkUsageDescription: Glance talks to your glasses and the local development server.
        NSBonjourServices: [_bonjour._tcp]
        UISupportedExternalAccessoryProtocols: [com.meta.ar.wearable]
        UIBackgroundModes: [processing, bluetooth-central, bluetooth-peripheral, external-accessory]
        UIRequiredDeviceCapabilities: [bluetooth-le, video-camera]
        MWDAT:
          AppLinkURLScheme: "glance://"
          MetaAppID: $(META_APP_ID)
          ClientToken: $(META_CLIENT_TOKEN)
          TeamID: $(DEVELOPMENT_TEAM)
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        GLANCE_API_BASE: $(GLANCE_API_BASE)
        META_APP_ID: $(META_APP_ID)
        META_CLIENT_TOKEN: $(META_CLIENT_TOKEN)
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Glance/Resources/Glance.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)com.glance.companion]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glance.companion
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          # The SDK needs a keychain entitlement; ad hoc signing keeps Simulator builds working without a team.
          CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"
    dependencies:
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
      - package: MWDAT
        product: MWDATDisplay
      - package: MWDAT
        product: MWDATInputs
  GlanceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Glance/Tests]
    dependencies:
      - target: Glance
  GlanceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Glance/UITests]
    dependencies:
      - target: Glance
schemes:
  Glance:
    build:
      targets:
        Glance: all
    test:
      targets: [GlanceTests, GlanceUITests]
