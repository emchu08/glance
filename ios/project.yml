# XcodeGen specification for the Glance iPhone companion.
# Generate: `cd ios && xcodegen generate` (brew install xcodegen). Open Glance.xcodeproj afterwards.
name: Glance
options:
  bundleIdPrefix: com.glance
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""            # set your team in Xcode → Signing & Capabilities
    GLANCE_API_BASE: "https://glance-blue.vercel.app"   # production origin; dev builds override below
    META_APP_ID: ""                  # Meta developer app id for the Wearables Device Access Toolkit
    META_CLIENT_TOKEN: ""
  configs:
    Debug:
      GLANCE_API_BASE: "http://localhost:3100"   # Simulator/dev only
packages:
  # Meta Wearables Device Access Toolkit — official Swift Package. Pin to the release you verify.
  # Resolve the current package URL/version from Meta's developer documentation before building;
  # if unavailable, the app still builds with the mock transport (see Package resolution notes in README.md).
  MWDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    from: "0.1.0"
targets:
  Glance:
    type: application
    platform: iOS
    sources: [Glance/Sources]
    resources: [Glance/Resources]
    info:
      path: Glance/Resources/Info.plist
      properties:
        CFBundleDisplayName: Glance
        CFBundleURLTypes:
          - CFBundleURLSchemes: [glance]
        NSCameraUsageDescription: Glance uses the camera on your glasses or phone to recognize products you choose to scan.
        NSBluetoothAlwaysUsageDescription: Glance connects to your Meta glasses over Bluetooth.
        NSLocalNetworkUsageDescription: Glance talks to your glasses and the local development server.
        NSBonjourServices: [_glance._tcp]
        UISupportedExternalAccessoryProtocols: [com.meta.wearables]
        UIRequiredDeviceCapabilities: [armv7, bluetooth-le, video-camera]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        GLANCE_API_BASE: $(GLANCE_API_BASE)
        META_APP_ID: $(META_APP_ID)
        META_CLIENT_TOKEN: $(META_CLIENT_TOKEN)
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Glance/Resources/Glance.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)com.glance.companion]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glance.companion
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          # The SDK needs a keychain entitlement; ad hoc signing keeps Simulator builds working without a team.
          CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"
    dependencies:
      - package: MWDAT
        products: [MWDATCore, MWDATCamera, MWDATDisplay, MWDATInputs, MWDATMockDevice]
        optional: true
  GlanceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Glance/Tests]
    dependencies:
      - target: Glance
